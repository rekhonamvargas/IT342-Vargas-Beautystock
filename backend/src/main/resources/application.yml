spring:
  application:
    name: beautystock-api
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://ep-jolly-mud-a1s7m4ju-pooler.ap-southeast-1.aws.neon.tech/IT342-Vargas-Beautystock?user=neondb_owner&password=npg_3d1TStbRYlwo&sslmode=require&channelBinding=require}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5
  flyway:
    locations: classpath:db/migration
    outOfOrder: true
    validateOnMigrate: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  cache:
    type: simple
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:385645622527-qmle6fj09e7pr2pesktcmr6umincu3sf.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET: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}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            issuer-uri: https://accounts.google.com
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://www.googleapis.com/oauth2/v4/token
            user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
            user-name-attribute: email

app:
  cors:
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001

  oauth2:
    # Frontend redirects
    redirect-success-url: http://localhost:3000/oauth2/callback
    redirect-failure-url: http://localhost:3000/login

    # Mobile redirects
    mobile-redirect-success-url: exp://5oslcdu-anonymous-8081.exp.direct/oauth2/callback
    mobile-redirect-failure-url: exp://5oslcdu-anonymous-8081.exp.direct/login

  weather:
    api-key: ${WEATHER_API_KEY:22fd7253c4449e90cda670adf8b46568}
    api-url: https://api.openweathermap.org/data/2.5
jwt:
  secret: ${JWT_SECRET:your-secret-key-at-least-32-characters-long-change-this-in-production-12345}
  expiration: 86400000
  refresh-expiration: 604800000



server:
  servlet:
    context-path: /api
  port: 8080

logging:
  level:
    root: INFO
    com.beautystock: DEBUG
    org.springframework.security: DEBUG
